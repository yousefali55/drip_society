<!doctype html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

    <!-- Primary Meta Tags -->
    <title>Drip Society </title>
    <meta
      name="description"
      content="Premium handcrafted coffee with rich flavors and unforgettable taste."
    />
    <meta
      name="keywords"
      content="Coffee, Turkish Coffee, Espresso, Drip Society, Premium Coffee, Coffee Beans"
    />
    <meta name="author" content="Drip Society" />

    <!-- Theme -->
    <meta name="theme-color" content="#5C3B28" />

    <!-- Mobile -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Drip Society" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="icons/Icon-192.png" />

    <!-- Manifest -->
    <link rel="manifest" href="manifest.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Drip Society Coffee" />
    <meta
      property="og:description"
      content="Premium handcrafted coffee with rich flavors and unforgettable taste."
    />
    <!-- بعد اما اشتري الدومين -->
    <meta property="og:image" content="https://YOUR-DOMAIN.com/favicon.png" />
    <meta property="og:url" content="https://YOUR-DOMAIN.com" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Drip Society Coffee" />
    <meta
      name="twitter:description"
      content="Premium handcrafted coffee with rich flavors and unforgettable taste."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/favicon.png" />
  </head>

  <body>
    <script src="flutter_bootstrap.js" async></script>
  </body>
</html>
